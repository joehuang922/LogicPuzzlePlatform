name: Android Release APK

# Two ways to trigger:
#  - Push an Android version tag (e.g. `git tag android-v0.1.0 && git push origin android-v0.1.0`).
#    The `android-v*` prefix keeps this workflow independent of the platform's own `v*` tags, so
#    releasing the web/API stack never triggers an APK build.
#  - Run it manually (workflow_dispatch) on a branch, e.g. `gh workflow run android-release.yml
#    --ref main`. The tag is then derived from versionName in app/build.gradle.kts and created by
#    the release step on the dispatched commit, so no tag push is needed. This is the path for
#    environments that can push branches but not tags (e.g. Claude Code cloud sessions). The run
#    refuses to start if that tag already exists, so an existing release is never overwritten.
#
# The job runs unit tests first; the APK build only happens if tests pass, then a release APK
# signed with the stable release keystore is attached to a GitHub Release you can download
# straight to your phone's browser. Using the same key on every build lets a new APK update
# the old one without an uninstall.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload the APK asset

# The Android app is a self-contained Gradle root nested in this repo.
defaults:
  run:
    working-directory: player/android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Tag push: release under the pushed tag. Manual run: derive android-v<versionName> from the
      # checked-out build file and make sure it's new before spending a build on it. The release
      # step below creates the tag at this commit; a tag created with GITHUB_TOKEN doesn't fire
      # another workflow run, so this never double-builds.
      - name: Resolve release tag
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
          else
            if [ "$REF_TYPE" != "branch" ]; then
              echo "::error::Run this workflow on a branch (e.g. main); to release an existing tag, push the tag instead."
              exit 1
            fi
            version=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
            if [ -z "$version" ]; then
              echo "::error::Could not read versionName from player/android/app/build.gradle.kts."
              exit 1
            fi
            tag="android-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists. Bump versionName in app/build.gradle.kts first."
              exit 1
            fi
          fi
          echo "Releasing $tag at $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Gradle in this project cannot parse newer JDKs; pin to 21 (matches local dev).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper and build files live under the nested Gradle root.
          build-root-directory: player/android

      # --- Gate: unit tests must pass before we build anything ---
      # The daemon JVM is selected by version via gradle/gradle-daemon-jvm.properties;
      # Gradle auto-detects the JDK 21 that setup-java installed.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Fail fast with a clear message if the signing secrets are missing. Without them the build
      # would still "succeed" but emit an UNSIGNED APK that Android refuses to install
      # (INSTALL_PARSE_FAILED_NO_CERTIFICATES) — a confusing failure to hit only on-device. See the
      # workflow header / player/android/README.md for how to set these repo secrets.
      - name: Verify signing secrets are present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secret(s):$missing"
            echo "::error::Set them under Settings → Secrets and variables → Actions, then re-run."
            echo "::error::Without them the APK would be unsigned and uninstallable. See player/android/README.md."
            exit 1
          fi
          echo "All release signing secrets are present."

      # Decode the release keystore (stored base64-encoded as a repo secret) to a file the
      # Gradle signingConfig can read. Written to RUNNER_TEMP, outside the repo tree, so it is
      # never committed. RELEASE_STORE_FILE is an absolute path, which rootProject.file() honors.
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # OCR parser Function URL. A plaintext repo variable (not a secret): it's an
          # endpoint, not a credential, and it's already baked into BuildConfig.PARSER_URL
          # of every shipped APK — extractable by decompiling — so masking it buys nothing.
          # Set it under Settings → Secrets and variables → Actions → Variables. Empty is
          # fine: the Admin image-parse step just stays disabled.
          PARSER_URL: ${{ vars.PARSER_URL }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          # Only matters for a manual run: GitHub creates the not-yet-existing tag at this commit.
          target_commitish: ${{ github.sha }}
          files: player/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
