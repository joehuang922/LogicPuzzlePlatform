name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: player

      - name: Build API
        run: npm run build
        working-directory: player/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy API & Database stacks
        id: deploy-api
        run: |
          mkdir -p ../frontend/dist && echo '<!DOCTYPE html><html></html>' > ../frontend/dist/index.html
          npx cdk deploy PuzzleDatabaseStack PuzzleAssetsStack PuzzleApiStack --require-approval never --outputs-file cdk-outputs.json \
            -c geminiApiKey="${GEMINI_API_KEY}"
          echo "api_url=$(jq -r '.PuzzleApiStack.ApiUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "parser_url=$(jq -r '.PuzzleApiStack.ParserUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "backfill_fn=$(jq -r '.PuzzleApiStack.SolverBackfillFunction' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          cat cdk-outputs.json
        working-directory: player/infra
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build Frontend
        run: npm run build
        working-directory: player/frontend
        env:
          VITE_API_URL: ${{ steps.deploy-api.outputs.api_url }}
          VITE_PARSER_URL: ${{ steps.deploy-api.outputs.parser_url }}

      - name: Deploy Frontend stack
        run: npx cdk deploy PuzzleFrontendStack --require-approval never
        working-directory: player/infra

      # Classify puzzles of solver-backed types that have no verdict yet (e.g. every
      # existing puzzle of a newly registered solver). Idempotent; runs last so a slow or
      # failed sweep never holds back the deploy itself.
      - name: Backfill solver verdicts
        run: |
          aws lambda invoke --function-name "${{ steps.deploy-api.outputs.backfill_fn }}" \
            --cli-read-timeout 960 --cli-binary-format raw-in-base64-out --payload '{}' backfill.json
          jq -r '.report[]? // .' backfill.json
          if jq -e '.errorMessage' backfill.json > /dev/null; then exit 1; fi
