org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Pin the daemon JVM: Gradle 8.11.1 cannot run on Java 26 (the machine default), so the
# daemon must launch on JDK 21. The version (not a path) is declared in
# gradle/gradle-daemon-jvm.properties; Gradle locates an installed JDK 21 by auto-detection,
# which keeps this portable across machines and CI.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
